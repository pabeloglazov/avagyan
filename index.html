<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Проверка полиса после ДТП</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Onest:wght@400;500;600;700;800&family=Arimo:wght@400;700&family=Noto+Sans+Armenian:wght@400;600;700;800&display=swap">
<style>
/* Layout: зелёная шапка с героем и загрузкой → «бумажный» declaration page с номерами-подсказками → разбор полиса → сценарии → заявка + подарок → почему мы + контакты.
   Сетка: контейнер 1160px, 12 колонок, шаг отступов 8/16/24/32/48/72. Всё выровнено по левому краю. */
:root{
  --band:#1F3A30; --band-2:#2A4A3D; --on-band:#F4F1E8; --on-band-2:#B7C6BC; --gold:#C9A961; --gold-lt:#E7C77E;
  --paper:#FFFFFF; --sheet:#FCFCF9; --mist:#F1F4F2; --ink:#15231C; --ink-2:#51635A; --line:#DCE3DE; --accent:#1F3A30; --mark:#A47A26;
  --ok:#1D7A4B; --ok-bg:#E4F2E9; --part:#946100; --part-bg:#FBEFD3; --no:#B03A2D; --no-bg:#FAE6E2; --info:#2C5985; --info-bg:#E7EEF6;
  --f-d:"Unbounded","Noto Sans Armenian","Onest",system-ui,sans-serif; --f-b:"Onest","Noto Sans Armenian",system-ui,-apple-system,"Segoe UI",sans-serif; --f-doc:"Arimo",Arial,Helvetica,sans-serif;
  --r-lg:24px; --r-md:16px; --r-sm:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --band:#14271F; --band-2:#1D3529; --on-band:#F4F1E8; --on-band-2:#A8B9AE;
  --paper:#0F1813; --sheet:#F6F5EF; --mist:#16231C; --ink:#E7EDE9; --ink-2:#A4B4AA; --line:#2B3C33; --accent:#A8D3B9; --mark:#E2BE6C;
  --ok:#72CF9A; --ok-bg:#163021; --part:#EDB24E; --part-bg:#33270F; --no:#EF8B7D; --no-bg:#371A16; --info:#90B9E3; --info-bg:#172535; color-scheme:dark}}
:root[data-theme="dark"]{
  --band:#14271F; --band-2:#1D3529; --on-band:#F4F1E8; --on-band-2:#A8B9AE;
  --paper:#0F1813; --sheet:#F6F5EF; --mist:#16231C; --ink:#E7EDE9; --ink-2:#A4B4AA; --line:#2B3C33; --accent:#A8D3B9; --mark:#E2BE6C;
  --ok:#72CF9A; --ok-bg:#163021; --part:#EDB24E; --part-bg:#33270F; --no:#EF8B7D; --no-bg:#371A16; --info:#90B9E3; --info-bg:#172535; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:16px/1.55 var(--f-b);-webkit-font-smoothing:antialiased}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;text-wrap:balance} p{margin:0}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
svg{display:block}
:focus-visible{outline:3px solid var(--gold-lt);outline-offset:2px}
.h2{font-family:var(--f-d);font-weight:800;font-size:clamp(24px,3vw,34px);line-height:1.15;letter-spacing:-.01em;color:var(--accent)}
.sub{color:var(--ink-2);max-width:62ch;margin-top:12px}
section{padding-block:72px}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px 24px;flex-wrap:wrap;margin-bottom:32px}

/* кнопки */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border:0;border-radius:999px;padding:0 24px;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;text-align:center;line-height:1.2}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-dark{background:var(--band);color:var(--on-band)}
.btn-gold{background:var(--gold-lt);color:#1F3A30}
.btn-line{background:transparent;border:1.5px solid currentColor}

/* иконки соцсетей */
.soc{display:flex;gap:8px}
.soc a{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1.5px solid rgba(231,199,126,.5);color:var(--gold-lt);text-decoration:none}
.soc a:hover{background:rgba(231,199,126,.12)}
.soc svg{width:19px;height:19px}

/* шапка */
.band{background:var(--band);color:var(--on-band)}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:20px}
.logo{height:44px;width:auto;display:block}
.top-r{display:flex;align-items:center;gap:16px}
.langs{display:flex;gap:2px;border:1.5px solid rgba(231,199,126,.4);border-radius:999px;padding:3px}
.langs button{border:0;background:none;color:var(--on-band-2);font-weight:700;font-size:13px;min-width:40px;height:32px;border-radius:999px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--gold-lt);color:#1F3A30}
.tel-top{font-weight:700;color:var(--gold-lt);text-decoration:none;white-space:nowrap;font-variant-numeric:tabular-nums}

/* герой */
.hero{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:24px;padding-block:40px 72px;align-items:start}
.hero-txt{grid-column:1/8;padding-top:8px}
.hero-up{grid-column:8/13}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.pill{border:1.5px solid rgba(231,199,126,.55);color:var(--gold-lt);border-radius:999px;padding:4px 14px;font-size:13.5px;font-weight:600}
.hero h1{font-family:var(--f-d);font-weight:800;font-size:clamp(32px,4.6vw,56px);line-height:1.06;letter-spacing:-.015em;max-width:15ch}
.lead{margin-top:24px;color:var(--on-band-2);font-size:17.5px;max-width:52ch}
.mgr{margin-top:32px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.mgr-txt{display:flex;align-items:center;gap:12px;font-size:14.5px;color:var(--on-band-2)}
.mgr strong{color:var(--on-band)}
.live{width:10px;height:10px;border-radius:50%;background:#5BCB8E;box-shadow:0 0 0 4px rgba(91,203,142,.2);flex:none}

/* загрузка */
.up{background:var(--paper);color:var(--ink);border-radius:var(--r-lg);padding:24px;box-shadow:0 30px 60px -30px rgba(0,0,0,.55)}
.up h2{font-family:var(--f-d);font-weight:600;font-size:20px;line-height:1.25}
.up .hint{color:var(--ink-2);font-size:14.5px;margin-top:8px}
.drop{margin-top:16px;display:grid;justify-items:center;gap:12px;border:2px dashed var(--line);border-radius:var(--r-md);padding:24px 16px;cursor:pointer;text-align:center;transition:border-color .15s,background-color .15s}
.drop.over{border-color:var(--gold);background:var(--mist)}
.drop .or{font-size:13.5px;color:var(--ink-2)}
.sheet-ico{width:44px;height:56px;border-radius:5px;background:var(--sheet);border:1.5px solid #9DB0A5;position:relative}
.sheet-ico i{position:absolute;left:8px;right:8px;height:3px;border-radius:2px;background:#9DB0A5}
.sheet-ico i:nth-child(1){top:10px;right:18px;background:#1F3A30}.sheet-ico i:nth-child(2){top:19px}.sheet-ico i:nth-child(3){top:27px}.sheet-ico i:nth-child(4){top:35px;background:var(--gold)}.sheet-ico i:nth-child(5){top:43px;right:20px}
.files{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.files:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;max-width:100%;background:var(--mist);border-radius:999px;padding:4px 4px 4px 12px;font-size:13.5px}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:210px}
.chip button{flex:none;width:26px;height:26px;border:0;border-radius:50%;background:var(--line);cursor:pointer;font-size:15px;line-height:1}
.go{width:100%;margin-top:16px}
.status{margin-top:12px;border-radius:var(--r-sm);padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:center}
.status.busy{background:var(--mist)} .status.err{background:var(--no-bg);color:var(--no)}
.spin{flex:none;width:16px;height:16px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--accent);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.which{margin-top:16px;border-top:1px solid var(--line);padding-top:4px}
.which summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px;font-weight:700;font-size:15px}
.which summary::-webkit-details-marker{display:none}
.which summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--ink-2);border-bottom:2px solid var(--ink-2);transform:rotate(45deg);margin-right:4px;transition:transform .15s}
.which[open] summary::after{transform:rotate(-135deg)}
.which ul{margin:4px 0 0;padding:0;list-style:none;display:grid;gap:10px}
.which li{display:grid;grid-template-columns:20px 1fr;gap:8px;font-size:14.5px;color:var(--ink-2)}
.which li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gold);margin:8px 0 0 4px}
.which a{display:inline-block;margin-top:12px;font-weight:700;color:var(--accent);text-underline-offset:3px}
.priv{margin-top:12px;font-size:13px;color:var(--ink-2)}

/* как читать declaration page */
.guide-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:24px;align-items:stretch}
.doc-col{grid-column:1/8;min-width:0}
.side-col{grid-column:8/13;min-width:0;position:relative}
.doc{background:var(--sheet);color:#1d2420;font-family:var(--f-doc);font-size:13.5px;line-height:1.4;border-radius:6px;box-shadow:0 1px 0 #d9ddd8,0 18px 40px -22px rgba(20,35,28,.45);padding:28px;border:1px solid #e3e6e1}
.doc-tag{display:inline-block;margin-top:8px;font-size:13.5px;color:var(--ink-2)}
.d-head{display:flex;justify-content:space-between;gap:16px;padding-bottom:14px;border-bottom:2px solid #1d2420;flex-wrap:wrap}
.d-head .ins{font-weight:700;font-size:15px}
.d-head .ttl{font-weight:700;font-size:20px;text-align:right}
.d-head small{display:block;color:#5d665f;font-weight:400;font-size:12px}
.d-meta{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
.d-cov{display:grid;grid-template-columns:minmax(0,1fr) auto 64px;gap:0 12px}
.d-cov .hd{font-weight:700;font-size:12px;color:#5d665f;padding:14px 0 6px;border-bottom:1px solid #c9cec8}
.d-cov .hd:nth-child(n+2){text-align:right}
.row{all:unset;box-sizing:border-box;display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;min-height:44px;padding:8px 8px 8px 4px;border-bottom:1px dotted #c9cec8;cursor:pointer;border-radius:4px}
.d-cov .row{grid-column:1/-1;grid-template-columns:24px minmax(0,1fr) auto 64px}
.d-meta .row{grid-template-columns:24px minmax(0,1fr)}
.d-meta .row .v{grid-column:2;text-align:left;white-space:normal;color:#3c4540}
.row:hover{background:#eef2ec}
.row[aria-expanded="true"]{background:#f6ecd2}
.row:focus-visible{outline:3px solid var(--gold);outline-offset:0}
.num{width:24px;height:24px;border-radius:50%;background:#1F3A30;color:#F4F1E8;font:700 12px/24px var(--f-b);text-align:center;font-variant-numeric:tabular-nums}
.row[aria-expanded="true"] .num{background:#A47A26}
.row .k{font-weight:700;min-width:0}
.row .v{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .pr{text-align:right;color:#5d665f;font-variant-numeric:tabular-nums}
.inline-exp{display:none}
.panel{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;border:1.5px solid var(--line);border-radius:var(--r-lg);padding:28px;background:var(--paper)}
.gidx{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin:auto 0 0;padding:20px 0 0;border-top:1px solid var(--line);list-style:none}
.gidx button{all:unset;box-sizing:border-box;display:grid;place-items:center;width:100%;aspect-ratio:1;max-width:40px;margin:0 auto;border-radius:50%;border:1.5px solid var(--line);cursor:pointer;font:700 13px/1 var(--f-b);color:var(--ink-2);font-variant-numeric:tabular-nums}
.gidx button:hover{border-color:var(--accent);color:var(--accent)}
.gidx button:focus-visible{outline:3px solid var(--gold-lt)}
.gidx button[aria-current="true"]{background:#A47A26;border-color:#A47A26;color:#fff}
.pn{display:flex;align-items:center;gap:12px}
.pn .num{flex:none;width:32px;height:32px;line-height:32px;font-size:14px;background:#A47A26}
.panel h3{font-family:var(--f-d);font-weight:600;font-size:19px;line-height:1.3;color:var(--accent)}
.exp{display:grid;gap:12px;margin-top:16px}
.exp .lbl{display:block;font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:4px}
.exp p{font-size:15.5px}
.exp .after{background:var(--mist);border-radius:var(--r-sm);padding:14px 16px}
.panel-nav{display:flex;justify-content:space-between;gap:12px;margin-top:16px}
.panel-nav .btn{min-height:44px;width:56px;padding:0;color:var(--ink)}

/* разбор полиса */
.policy-sec{background:var(--mist)}
.badge{display:inline-flex;align-items:center;min-height:30px;border-radius:999px;padding:0 14px;font-size:13.5px;font-weight:700}
.badge.ex{border:1.5px dashed var(--mark);color:var(--mark)}
.badge.mine{background:var(--ok-bg);color:var(--ok)}
.pol-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:24px;align-items:stretch}
.ticket{grid-column:1/5;display:grid;grid-template-rows:2fr repeat(3,1fr);background:var(--band);color:var(--on-band);border:1px solid rgba(231,199,126,.2);border-radius:var(--r-lg);overflow:hidden;min-width:0}
.tk-top{display:flex;flex-direction:column;justify-content:center;padding:16px 24px}
.ticket .lbl{font-size:13.5px;color:var(--on-band-2)}
.split{white-space:nowrap;font-family:var(--f-d);font-weight:800;font-size:46px;line-height:1.05;color:var(--gold-lt);margin-top:8px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;overflow-wrap:anywhere}
.split-key{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px;font-size:12.5px;color:var(--on-band-2)}
.tk{display:contents}
.tk div{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:12px;padding:10px 24px;border-top:1px solid rgba(231,199,126,.22);font-size:14.5px}
.tk dt{color:var(--on-band-2)} .tk dd{margin:0;text-align:right;font-weight:600;overflow-wrap:anywhere}
.cov-wrap{grid-column:5/13;min-width:0;display:flex}
.cov{flex:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:1fr;background:var(--paper);border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line)}
.cov-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;min-height:64px;padding:10px 16px 10px 18px;border-bottom:1px solid var(--line)}
.cov-row:nth-child(odd){border-right:1px solid var(--line)}
.cov-row:nth-last-child(-n+2){border-bottom:0}
.cov-row .n{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2);min-width:0}
.q{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);background:none;color:var(--ink-2);font:700 12px/1 var(--f-b);cursor:pointer;display:inline-grid;place-items:center}
.q:hover{border-color:var(--accent);color:var(--accent)}
.cov-row .v{font-weight:700;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.cov-row .v.none{color:var(--no);font-weight:600}
.warns{display:grid;gap:8px;margin-top:16px;grid-column:1/-1}
.warns:empty{display:none}
.warn{display:grid;grid-template-columns:24px 1fr;gap:10px;background:var(--part-bg);border-radius:var(--r-sm);padding:12px 16px;font-size:14.5px}
.warn b{width:24px;height:24px;border-radius:50%;background:var(--part);color:var(--paper);display:grid;place-items:center;font-size:13px}

/* сценарии */
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:24px}
.tab{min-height:56px;padding:8px 14px;border-radius:var(--r-md);border:1.5px solid var(--line);background:var(--paper);color:var(--ink);font-weight:700;font-size:14.5px;line-height:1.25;cursor:pointer;text-align:left}
.tab[aria-selected="true"]{background:var(--band);border-color:var(--band);color:var(--on-band)}
.items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"st st" "h a" "p p";gap:8px 16px;align-content:start;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-md);padding:20px 20px 20px 24px;position:relative;overflow:hidden}
.item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--line)}
.item.ok::before{background:var(--ok)} .item.part::before{background:var(--part)} .item.no::before{background:var(--no)} .item.info::before{background:var(--info)}
.st{grid-area:st;justify-self:start;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:700}
.st.ok{background:var(--ok-bg);color:var(--ok)} .st.part{background:var(--part-bg);color:var(--part)} .st.no{background:var(--no-bg);color:var(--no)} .st.info{background:var(--info-bg);color:var(--info)}
.item h3{grid-area:h;font-size:16.5px;line-height:1.3;font-weight:700}
.item .amt{grid-area:a;font-family:var(--f-d);font-weight:600;font-size:17px;color:var(--accent);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.item p{grid-area:p;color:var(--ink-2);font-size:14.5px}
.cta{margin-top:24px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:16px 24px;background:var(--band);color:var(--on-band);border-radius:var(--r-lg);padding:24px}
.cta p{color:var(--on-band-2);max-width:58ch}
.cta .acts{display:flex;gap:8px;flex-wrap:wrap}
.cta .btn-line{color:var(--on-band);border-color:rgba(231,199,126,.55)}

/* заявка */
.lead-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:24px;align-items:stretch}
.form-col{grid-column:1/8;min-width:0}
.gift-col{grid-column:8/13;min-width:0}
form,.okbox{height:100%;border:1.5px solid var(--line);border-radius:var(--r-lg);padding:32px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:24px}
.f{display:grid;gap:6px;align-content:start;min-width:0}
.f.full{grid-column:1/-1}
.f label,.f .lg{font-size:13.5px;font-weight:600;color:var(--ink-2)}
.f input,.f select{display:block;width:100%;min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;height:50px;border:1.5px solid var(--line);border-radius:var(--r-sm);background:var(--paper);padding:0 14px}
.f select{background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 15px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.f input[type="date"]{line-height:50px;cursor:pointer}
.f input[type="date"]::-webkit-calendar-picker-indicator{cursor:pointer}
.f input:focus,.f select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(201,169,97,.35)}
.seg{display:grid;gap:8px}
.seg.s4{grid-template-columns:repeat(2,minmax(0,1fr))} .seg.s3{grid-template-columns:repeat(3,minmax(0,1fr))}
.seg label{position:relative;display:flex;align-items:center;min-height:46px;padding:8px 14px;border:1.5px solid var(--line);border-radius:var(--r-sm);font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;line-height:1.25}
.seg input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.seg label:has(input:checked){background:var(--band);border-color:var(--band);color:var(--on-band)}
.seg label:has(input:focus-visible){outline:3px solid var(--gold-lt)}
.consent{display:grid;grid-template-columns:22px 1fr;gap:10px;margin-top:20px;font-size:14px;color:var(--ink-2);cursor:pointer}

const CA_MIN_BI = 30000;
function buildScenario(c, scen){
  const P = { pp:money(c.um_pp), pa:money(c.um_pa), m:money(c.medpay), d:money(c.collision_ded), u:money(c.umpd), pd:money(c.pd) };
  const out = [], add = (key, st, extra) => out.push({ key, st, p:Object.assign({}, P, extra || {}) });
  const uimPP = c.uim_pp ?? c.um_pp;
  const hasColl = c.collision === true || c.collision_ded != null;
  const medpay = () => has(c.medpay) ? add("medpay_yes","ok") : add("medpay_none","no");
  if (scen === "insured"){
    add("their_bi","ok");
    if (has(uimPP) && uimPP > CA_MIN_BI) add("uim_yes","ok",{ uim:money(uimPP), extra:money(uimPP - CA_MIN_BI) });
    else if (has(uimPP)) add("uim_low","part",{ uim:money(uimPP) });
    else add("uim_none","no");
    medpay(); add("car_their","ok"); if (hasColl) add("collision_opt","ok"); add("pain","ok");
  } else if (scen === "uninsured"){
    has(c.um_pp) ? add("um_yes","ok") : add("um_none","no");
    medpay();
    if (hasColl && has(c.umpd)) add("umpd_waiver","ok");
    else if (hasColl) add("collision_only","part");
    else if (has(c.umpd)) add("umpd_only","part");
    else add("car_none","no");
  } else if (scen === "hitrun"){
    has(c.um_pp) ? add("um_hr","ok") : add("um_none_hr","no");
    medpay(); hasColl ? add("collision_hr","part") : add("car_none_hr","no");
  } else {
    if (has(c.bi_pp)) add("others_bi","ok",{ pp:money(c.bi_pp), pa:money(c.bi_pa || c.bi_pp) }); else add("others_bi_none","no");
    if (has(c.pd)) add("others_pd","ok");
    hasColl ? add("own_collision","part") : add("own_car_none","no");
    has(c.medpay) ? add("own_medpay","ok") : add("own_injury_none","no");
    if (has(c.bi_pp)) add("passengers","ok",{ pp:money(c.bi_pp) });
    add("fault","info");
  }
  return out;

  S.files = S.files.slice(0, 4); setStatus(null); renderFiles();

const toJpeg = cv => new Promise(r => cv.toBlob(r, "image/jpeg", 0.86));
async function pdfToImages(file){
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise, out = [];
  for (let i = 1; i <= Math.min(pdf.numPages, 3); i++){
    const page = await pdf.getPage(i), v0 = page.getViewport({ scale:1 });
    const vp = page.getViewport({ scale: Math.min(2.2, 1700 / Math.max(v0.width, v0.height)) });
    const cv = document.createElement("canvas"); cv.width = vp.width; cv.height = vp.height;
    const ctx = cv.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0,0,cv.width,cv.height);
    await page.render({ canvasContext:ctx, viewport:vp }).promise; out.push(await toJpeg(cv));
  }
  return out;
}
async function imageToJpeg(file){
  const bmp = await createImageBitmap(file), k = Math.min(1, 1800 / Math.max(bmp.width, bmp.height));
  const cv = document.createElement("canvas"); cv.width = Math.round(bmp.width*k); cv.height = Math.round(bmp.height*k);
  const ctx = cv.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0,0,cv.width,cv.height); ctx.drawImage(bmp,0,0,cv.width,cv.height);
  return toJpeg(cv);
}
const blobToB64 = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.onerror = rej; r.readAsDataURL(b); });

/* ---------- AI ---------- */
const useApi = () => CONFIG.API_URL && !CONFIG.API_URL.startsWith("%%");
const cap = name => (window.claude && window.claude.use) ? window.claude.use(name).catch(() => null) : Promise.resolve(null);
const CAPS = useApi() ? {} : { sample:cap("sample"), db:cap("db"), user:cap("user"), downloads:cap("downloads") };
const parseJSON = text => { const m = String(text).match(/\{[\s\S]*\}/); return m ? JSON.parse(m[0]) : null; };
async function api(payload){
  const r = await fetch(CONFIG.API_URL, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body:JSON.stringify(payload) });
  const j = await r.json(); if (!j.ok) throw { code:"api" }; return j;
}
async function extract(images){
  if (useApi()) return (await api({ action:"analyze", images: await Promise.all(images.map(blobToB64)) })).data;
  const sample = await CAPS.sample; if (!sample) throw { code:"noai" };
  const lim = await sample.limits().catch(() => null), max = lim && lim.images ? lim.images.maxCount : 4;
  const { text } = await sample(EXTRACT_PROMPT, { images:images.slice(0, max), modelTier:"default" });
  return parseJSON(text);
}
function normalize(d){
  const n = v => (v === null || v === undefined || v === "" || isNaN(Number(v))) ? null : Number(v), c = {};
  ["bi_pp","bi_pa","pd","um_pp","um_pa","uim_pp","uim_pa","umpd","medpay","collision_ded","comprehensive_ded","rental_day","rental_max"].forEach(k => c[k] = n(d[k]));
  c.collision = d.collision === true || c.collision_ded != null;
  c.comprehensive = d.comprehensive === true || c.comprehensive_ded != null;
  c.rental = !!d.rental || has(c.rental_day); c.towing = !!d.towing;
  c.insurer = d.insurer || ""; c.period_start = d.period_start || null; c.period_end = d.period_end || null;
  c.vehicles = Array.isArray(d.vehicles) ? d.vehicles.filter(Boolean).slice(0, 6) : [];
  return c;
}
async function analyze(){
  if (S.busy || !S.files.length) return;
  S.busy = true; renderFiles();
  try {
    setStatus("busy", L().st_read);
    let images = [];
    try { for (const f of S.files) images = images.concat(/pdf/.test(f.type) || /\.pdf$/i.test(f.name) ? await pdfToImages(f) : [await imageToJpeg(f)]); }
    catch (e){ throw { code:"file" }; }
    images = images.filter(Boolean).slice(0, 4);
    if (!images.length) throw { code:"file" };
    setStatus("busy", L().st_ai);
    const d = await extract(images);
    if (!d) throw { code:"ai" };
    if (d.is_dec_page === false) throw { code:"notdec" };
    S.cov = normalize(d); S.isExample = false;
    setStatus(null); renderPolicy(); renderScenario();
    $("policy").scrollIntoView({ behavior:smooth() });
  } catch (e){
    const map = { file:"err_file", notdec:"err_notdec", noai:"err_noai", not_granted:"err_denied" };
    setStatus("err", L()[map[e && e.code] || "err_ai"]);
  } finally { S.busy = false; renderFiles(); }
}

  if (!$("fconsent").checked){ err.textContent = t.e_consent; $("fconsent").focus(); return; }
  const c = S.cov;
  const lead = { name, phone, lang:$("flang").value,
    scenario:(document.querySelector('input[name="scen"]:checked') || {}).value || S.scen,
    injured:(document.querySelector('input[name="inj"]:checked') || {}).value || "",
